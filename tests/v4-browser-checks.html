<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>V4 – Browserprüfungen (PageTitle, Mein-Plan-Struktur, Kompaktheit, Hero)</title>
<!--
  Reproduzierbare Browserprüfungen für V4 (ersetzt kein Cypress, ergänzt es):
  PageTitle-Regel, Zielstruktur und Länge von «Mein Plan», Kompaktheit des Schnellstarts
  sowie das zentrale Hero-Bild.

  Ausführen (statischer Server ab Repo-Wurzel, z. B. Port 8150):
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --disable-gpu \
      --user-data-dir=%TEMP%\v4check --virtual-time-budget=120000 \
      --dump-dom http://127.0.0.1:8150/tests/v4-browser-checks.html
  Der Bericht steht im <pre id="report"> des DOM-Dumps.
-->
<style>body{font:12px/1.35 monospace;margin:0;padding:8px}iframe{border:0}pre{white-space:pre-wrap}</style>
</head>
<body><div id="frames"></div><pre id="report">running…</pre>
<script>
const out = [];
const ok = (c, m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
const wait = ms => new Promise(r => setTimeout(r, ms));

async function frame(w, h) {
  const f = document.createElement('iframe');
  f.width = w; f.height = h; f.src = '/v4.html';
  document.getElementById('frames').appendChild(f);
  await new Promise(r => { f.onload = r; });
  await wait(800);
  return f;
}

/* ---------- PageTitle: eine Zeile, Titel links, Kontext rechts ---------- */
function titleChecks(d, win, tag, {context = true} = {}) {
  const head = d.querySelector('.v4-head');
  const h1 = head?.querySelector('.v4-page-title');
  const ctx = head?.querySelector('.v4-page-context');
  const hb = head?.getBoundingClientRect(), tb = h1?.getBoundingClientRect(), cb = ctx?.getBoundingClientRect();
  ok(!!head && !!h1, tag + ' PageTitle vorhanden');
  if (!head || !h1) return;
  if (context) {
    ok(!!ctx, tag + ' Kontext vorhanden');
    ok(cb.left > tb.right - 1, tag + ' Kontext rechts vom Titel (Titel bis ' + Math.round(tb.right) + ', Kontext ab ' + Math.round(cb.left) + ')');
    ok(cb.top < tb.bottom, tag + ' Kontext springt nicht unter den Titel');
    const lines = Math.round(cb.height / (parseFloat(win.getComputedStyle(ctx).lineHeight) || 17));
    ok(lines <= 2, tag + ' Kontext höchstens zwei Zeilen (' + lines + ' Zeilen, ' + Math.round(cb.height) + ' px)');
    const hcs = win.getComputedStyle(h1), ccs = win.getComputedStyle(ctx);
    ok(parseFloat(hcs.fontSize) > parseFloat(ccs.fontSize) * 1.5, tag + ' Kontext deutlich kleiner (' + hcs.fontSize + ' vs ' + ccs.fontSize + ')');
    ok(hcs.whiteSpace === 'nowrap', tag + ' Titel bricht nicht um');
    ok(Math.abs(tb.height - parseFloat(hcs.lineHeight)) < 2, tag + ' Titel einzeilig (' + Math.round(tb.height) + ' px)');
    /* Kein Umbruch mitten im Wort: «anywhere» würde den Kontext buchstabenweise zerreissen. */
    ok(ccs.overflowWrap !== 'anywhere', tag + ' Kontext bricht nicht mitten im Wort (' + ccs.overflowWrap + ')');
    /* Lange Titel bekommen eine Schriftstufe weniger, damit der Kontext Platz behält. */
    const longTitle = (h1.textContent.trim().length > 16);
    ok(!!head.classList.contains('v4-head-long') === longTitle, tag + ' Kennzeichnung langer Titel (' + h1.textContent.trim().length + ' Zeichen)');
    if (longTitle && win.innerWidth <= 520) ok(parseFloat(hcs.fontSize) <= 21, tag + ' langer Titel bleibt bei ≤ 21 px (' + hcs.fontSize + ')');
  }
  ok(d.querySelectorAll('#app .v4-head').length === 1, tag + ' genau ein Kopf');
  ok(!/#app .*v4-subtitle|v4-status-line/.test(d.body.innerHTML), tag + ' keine separate Status-/Untertitelzeile');
}

/* ---------- Mein Plan: Zielstruktur, Reihenfolge, Länge ---------- */
async function planStructure(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow;
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(400);
  const tag = w + '×' + h + ' Mein Plan';
  titleChecks(d, win, tag);
  const app = d.getElementById('app');
  const order = [...app.children].map(node => {
    if (node.classList.contains('v4-head')) return 'title';
    if (node.classList.contains('v4-verdict')) return 'status';
    if (node.classList.contains('v4-tiles')) return 'tiles';
    if (node.classList.contains('v4-lever')) return 'lever';
    if (node.classList.contains('v4-next')) return 'improve';
    if (node.classList.contains('v4-rows')) return 'rows';
    return node.className || node.tagName;
  });
  ok(JSON.stringify(order) === JSON.stringify(['title','status','tiles','lever','improve','rows']), tag + ' Zielstruktur exakt (' + order.join(' · ') + ')');
  ok(app.querySelectorAll('.v4-tile').length === 4, tag + ' genau vier Kennzahlen (' + app.querySelectorAll('.v4-tile').length + ')');
  const labels = [...app.querySelectorAll('.v4-tile > span')].map(node => node.textContent.replace(/\s+/g, ' ').trim());
  const expected = ['Einkommen netto / Monat', 'Bedarf netto / Monat', 'Aus Vermögen / Monat', 'Startkapital'];
  ok(labels.every((label, index) => label.startsWith(expected[index])), tag + ' Kennzahlenkette (' + labels.join(' | ') + ')');
  const values = [...app.querySelectorAll('.v4-tile > strong')].map(node => Number(node.textContent.replace(/[^\d]/g, '')));
  ok(values[0] + values[2] === values[1], tag + ' Einkommen + Aus Vermögen = Bedarf (' + values[0] + ' + ' + values[2] + ' = ' + values[1] + ')');
  ok(values[1] > 0 && values[3] >= 0, tag + ' Bedarf und Startkapital plausibel');
  const tileText = app.querySelector('.v4-tiles').textContent;
  ok(!/In einzelnen Jahren nicht gedeckt|Entnahme aus Vermögen|Renten total \//.test(tileText), tag + ' keine widersprüchliche Kennzahlen-Notiz');
  const infoButton = app.querySelector('.v4-tiles .v3-info');
  infoButton?.click();
  await wait(150);
  const modalBody = d.getElementById('v4ModalBody')?.textContent ?? '';
  ok(/Einkommen brutto/.test(modalBody) && /Einkommen netto/.test(modalBody), tag + ' ⓘ Einkommen zeigt brutto → netto');
  d.querySelector('[data-modal-close]')?.click();
  await wait(100);
  const heroImg = d.querySelector('#v4Hero img');
  ok((heroImg?.currentSrc ?? '').endsWith(w >= 700 ? 'public/images/Background_Desktop.png' : 'public/images/Background.png'), tag + ' Hero-Asset nach Breite (' + (heroImg?.currentSrc ?? '').split('/').pop() + ')');
  ok(app.querySelectorAll('.v4-rows .v4-row').length === 2, tag + ' genau zwei sekundäre Zeilen');
  ok(app.querySelectorAll('.v4-verdict button').length === 0, tag + ' keine Aktion in der Status-Card');
  const rows = [...app.querySelectorAll('.v4-rows .v4-row')].map(b => b.textContent.trim());
  ok(rows[0] === 'Jahresverlauf' && /^Meine Varianten · \d gespeichert$/.test(rows[1]), tag + ' Zeilen korrekt (' + rows.join(' | ') + ')');
  const improve = app.querySelector('.v4-next');
  ok(/Plan präzisieren/.test(improve?.textContent ?? ''), tag + ' zustandsabhängige Card «Plan präzisieren» vorhanden');
  const forbiddenSelectors = ['.v4-details', '.v4-detail-list', '.v4-detail', '.v4-save', '#saveLabel', '[data-save]', '.v4-open-list', '.v4-variant'];
  const presentSelectors = forbiddenSelectors.filter(selector => app.querySelector(selector));
  const forbiddenLabels = ['Details', 'Plan genauer machen', 'Plan verbessern', 'Drei Geldtöpfe', 'Jetzt speichern', 'Automatisch gespeichert', 'Einnahmen im Ruhestand', 'Renten total / Monat', 'Entnahme aus Vermögen / Monat', 'Anlagestrategie', 'Töpfe-Modell'];
  const allLabels = [...app.querySelectorAll('strong,h2,h3,button,a,span')].map(node => node.textContent.trim());
  const presentLabels = forbiddenLabels.filter(entry => allLabels.includes(entry));
  ok(presentSelectors.length === 0 && presentLabels.length === 0, tag + ' keine verbotenen Blöcke' + ((presentSelectors.length || presentLabels.length) ? ' (' + [...presentSelectors, ...presentLabels].join(', ') + ')' : ''));
  const height = app.getBoundingClientRect().height;
  ok(height <= win.innerHeight * 1.3, tag + ' Screenlänge ≤ 1,3 Viewports (' + Math.round(height) + ' px / ' + win.innerHeight + ' px = ' + (height / win.innerHeight).toFixed(2) + ')');
  out.push('      ' + tag + ' Struktur: ' + order.join(' · ') + ' · Höhe ' + Math.round(height) + ' px');
  f.remove();
}

/* ---------- Schnellstart: Kompaktheit, PageTitle, Hero, kantonales Feld ---------- */
async function startChecks(w, h, situation = 'pre') {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + '×' + h + (situation === 'pre' ? '' : ' [' + situation + ']');
  if (situation !== 'pre') { d.querySelector('[data-situation="' + situation + '"]')?.click(); await wait(350); }
  titleChecks(d, win, tag);
  ok(d.querySelector('.v4-page-context')?.textContent.trim() === '5 Angaben für deinen ersten Überblick.', tag + ' Schnellstart-Kontext');
  /* Kopfbereich ruhig für die Aufnahme: kräftiger Creme-Schleier oben, darunter weich
     ausblendend; Titel/Logo in Navy, Kontext dunkel und kräftig, kein Textschatten. */
  const hero = d.getElementById('v4Hero');
  const heroAfter = hero ? win.getComputedStyle(hero, '::after').backgroundImage : '';
  ok(/rgba\(247, 246, 242, 0\.9\)/.test(heroAfter) || /0\.90/.test(heroAfter), tag + ' Hero: kräftiger Creme-Schleier oben (' + heroAfter.slice(0, 48) + '…)');
  ok(/84px/.test(heroAfter) && /146px/.test(heroAfter), tag + ' Hero: Verlauf bis unter die Titelzeile, danach ausblendend');
  const titleStyle = win.getComputedStyle(d.querySelector('.v4-page-title'));
  const contextStyle = win.getComputedStyle(d.querySelector('.v4-page-context'));
  const brandStyle = win.getComputedStyle(d.querySelector('.brand-name'));
  ok(titleStyle.textShadow === 'none' && contextStyle.textShadow === 'none' && brandStyle.textShadow === 'none', tag + ' kein Textschatten (' + titleStyle.textShadow + ')');
  const darkness = value => (value.match(/\d+/g) ?? []).slice(0, 3).reduce((sum, part) => sum + Number(part), 0);
  ok(darkness(titleStyle.color) < 220 && darkness(brandStyle.color) < 260, tag + ' Titel und Logo in dunklem Navy (' + titleStyle.color + ' / ' + brandStyle.color + ')');
  ok(contextStyle.fontWeight === '500' && darkness(contextStyle.color) < 240, tag + ' Kontext dunkler und kräftiger (' + contextStyle.color + ' / ' + contextStyle.fontWeight + ')');
  const cards = [...d.querySelectorAll('.v4-start-card')];
  ok(cards.length === 5, tag + ' fünf Eingabekarten (' + cards.length + ')');
  ok(new Set(cards.map(c => Math.round(c.getBoundingClientRect().height))).size === 1, tag + ' gleiche Kartenhöhe (' + cards.map(c => Math.round(c.getBoundingClientRect().height)).join('/') + ')');
  const clipped = cards.map(c => c.querySelector('label')).filter(l => l && (l.scrollWidth > l.clientWidth + 1 || l.getClientRects().length > 1));
  ok(clipped.length === 0, tag + ' Labels einzeilig und ungekürzt' + (clipped.length ? ' (' + clipped.map(l => '«' + l.textContent.trim() + '» ' + l.scrollWidth + '>' + l.clientWidth).join(', ') + ')' : ''));
  ok(cards.filter(c => c.querySelector('p')).length === 0, tag + ' keine Hilfstexte unter den Feldern');
  const pills = [...d.querySelectorAll('.v4-segment')];
  ok(pills.filter(p => { const s = p.querySelector('span'); return s && s.scrollWidth > s.clientWidth + 1; }).length === 0, tag + ' Pills ungekürzt');
  ok(d.documentElement.scrollWidth <= win.innerWidth + 1, tag + ' kein horizontales Scrollen (' + d.documentElement.scrollWidth + ' ≤ ' + win.innerWidth + ')');
  ok(d.documentElement.scrollHeight <= win.innerHeight, tag + ' kein Scrollen (' + d.documentElement.scrollHeight + ' ≤ ' + win.innerHeight + ')');
  ok(d.querySelector('.menu-button')?.hidden === true, tag + ' kein Hamburger im Schnellstart');
  const trigger = d.querySelector('.canton-trigger');
  const value = trigger?.querySelector('span:not(.canton-trigger-hint):not(.canton-chevron)')?.textContent.trim() ?? '';
  const hint = trigger?.querySelector('.canton-trigger-hint')?.textContent.trim() ?? '';
  ok(value === 'Bitte wählen' && hint === 'für deine Steuerschätzung', tag + ' Kanton im Feld kompakt («' + value + '» + «' + hint + '»)');
  ok(!/Appenzell|Ausserrhoden/.test(trigger?.textContent ?? ''), tag + ' kein Kantonsname im Feld');
  const options = [...d.querySelectorAll('#start-canton option')].map(option => option.textContent.trim());
  ok(options.length > 20 && options.some(text => text.includes('·')), tag + ' Auswahlliste bleibt ausführlich (' + options.length + ' Einträge)');
  const host = d.getElementById('v4Hero'), img = host?.querySelector('img');
  const r = host?.getBoundingClientRect(), cs = host ? win.getComputedStyle(host) : null, ics = img ? win.getComputedStyle(img) : null;
  ok(host?.dataset.mode === 'start', tag + ' Hero-Modus start');
  ok(!!img && img.complete && img.naturalWidth > 500, tag + ' Hero-Bild geladen (' + img?.naturalWidth + '×' + img?.naturalHeight + ')');
  ok((img?.currentSrc ?? '').endsWith(w >= 700 ? 'public/images/Background_Desktop.png' : 'public/images/Background.png'), tag + ' verbindliches Hero-Asset nach Breite (' + (img?.currentSrc ?? '').split('/').pop() + ')');
  ok(!!host?.querySelector('source[media*="700px"]'), tag + ' Desktop-Quelle im picture');
  ok(ics?.objectFit === 'cover' && /^(center|50%)/.test(ics?.objectPosition ?? ''), tag + ' object-fit cover / object-position center (' + ics?.objectPosition + ')');
  ok(cs?.position === 'absolute' && cs?.backgroundAttachment !== 'fixed', tag + ' kein Parallax');
  ok(ics?.animationName === 'none' && ics?.transitionDuration === '0s', tag + ' keine Animation');
  ok((r?.height || 0) >= 250, tag + ' Hero-Band sichtbar (' + Math.round(r?.width) + '×' + Math.round(r?.height) + ')');
  ok((r?.height || 0) <= win.innerHeight * 0.7, tag + ' Hero-Band bleibt ruhig (' + Math.round((r?.height || 0) / win.innerHeight * 100) + ' % der Höhe)');
  ok(!/https?:\/\//.test([...d.querySelectorAll('img')].map(i => i.getAttribute('src')).join(' ')), tag + ' kein externes Bild');
  out.push('      ' + tag + ' Hero: mode=' + host?.dataset.mode + ' ' + Math.round(r?.width) + '×' + Math.round(r?.height));
  // Zum Schluss: Schnellstart abschicken und den Default prüfen (ändert den Speicherstand)
  if (situation === 'pre') {
    const form = d.getElementById('v4Form');
    const set = (name, value) => { const input = d.querySelector(`input[name="${name}"]`); if (input) { input.value = value; input.dispatchEvent(new win.Event('input', {bubbles:true})); } };
    if (form) {
      set('age', '60'); set('retirement', '65'); set('pk', '600000'); set('need', '6000');
      const city = d.getElementById('start-canton');
      if (city) { city.value = 'ZH'; city.dispatchEvent(new win.Event('change', {bubbles:true})); }
      form.dispatchEvent(new win.Event('submit', {bubbles:true, cancelable:true}));
      await wait(900);
      const lever = d.querySelector('.v4-lever-value')?.textContent.trim() ?? '';
      ok(lever === '50 % Kapitalbezug', tag + ' Default nach Schnellstart: 50 % Kapitalbezug («' + lever + '»)');
      const stored = win.localStorage.getItem('retirement-v3-plan') ?? '';
      ok(/"pkShare":50/.test(stored) && /"v3Variants":\[0,50,100\]/.test(stored), tag + ' Varianten 0/50/100 mit 50 % als aktuellem Plan');
    }
  }
  // Andere Prüfungen dürfen nicht vom geschriebenen Stand beeinflusst werden
  win.__v4SuspendSave = true;
  win.localStorage.removeItem('retirement-v3-plan');
  f.remove();
}

/* ---------- Alle Screens: PageTitle + Hero-Modus ---------- */
/* Alle Editoren liegen hinter dem einen Menüpunkt «Angaben & Grundlagen» – die Navigation
   folgt den Aufgaben, nicht dem Datenmodell (docs/information-architecture-v4.md §7).
   Jahresverlauf und Annahmen haben eigene Menüpunkte. */
async function openEditor(d, page) {
  const direct = d.querySelector(`[data-menu-page="${page}"]`);
  if (direct) { direct.click(); await wait(450); return; }
  d.querySelector('[data-menu-page="basics"]')?.click();
  await wait(400);
  d.querySelector(`#app [data-v4-next="${page}"]`)?.click();
  await wait(450);
}
async function screenChecks(w, h) {
  const routes = ['Schnellstart', 'Mein Plan', 'Angaben & Grundlagen', 'Plan präzisieren', 'Varianten', 'years', 'personal', 'ahv', 'need', 'assets', 'assumptions', 'pension', 'extra'];
  for (const route of routes) {
    const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px ' + route;
    try {
      if (route === 'Schnellstart') { win.__v4SuspendSave = true; win.localStorage.removeItem('retirement-v3-plan'); win.V4.renderStart(); }
      else {
        win.DevFixture.write(win.DevFixture.scenarios['vollstaendig']()); win.V4.load();
        if (route === 'Varianten') win.V4.renderVariants();
        else if (route === 'Angaben & Grundlagen') d.querySelector('[data-menu-page="basics"]')?.click();
        else if (route === 'Plan präzisieren') d.querySelector('[data-v4-next="improve"]')?.click();
        else if (route === 'Mein Plan') { /* schon offen */ }
        else await openEditor(d, route);
      }
    } catch (e) { out.push('      ' + tag + ' Aktion: ' + e.message); }
    await wait(350);
    titleChecks(d, win, tag, {context: true});
    const title = d.querySelector('.v4-page-title')?.textContent.trim() ?? '';
    ok(title.endsWith('.'), tag + ' Titel endet mit Punkt («' + title + '»)');
    const mode = d.getElementById('v4Hero')?.dataset.mode;
    if (route === 'Schnellstart') ok(mode === 'start', tag + ' Hero start');
    else ok(mode === 'calm', tag + ' Hero calm (' + mode + ')');
    /* Detailseiten haben GENAU EINEN Rückweg; das «✕» gehört nur Modals. «Zurück» ist reine
       Navigation und führt zur übergeordneten Seite (nicht zwingend auf «Mein Plan»). */
    const isDetail = route !== 'Mein Plan' && route !== 'Schnellstart';
    const headBack = d.querySelector('.v4-head-back'), headClose = d.querySelector('.v4-head-close');
    if (isDetail) {
      ok(!!headBack && !!headBack.querySelector('svg') && d.querySelectorAll('#app .v4-head-back').length === 1, tag + ' genau ein Rückweg-Knopf im Kopf');
      ok(!headClose, tag + ' kein «✕» auf dem Screen (nur Modals)');
      /* Editoren werden über «Angaben & Grundlagen» geöffnet, «Annahmen» über das Menü. */
      const viaBasics = !['Angaben & Grundlagen', 'Plan präzisieren', 'Varianten', 'years', 'assumptions'].includes(route);
      const expectedBack = viaBasics ? 'Angaben & Grundlagen' : 'Mein Plan';
      ok(headBack?.textContent.trim() === expectedBack, tag + ' Rückweg nennt die übergeordnete Seite («' + (headBack?.textContent.trim() ?? '') + '»)');
      headBack?.click();
      await wait(420);
      const afterTitle = d.querySelector('.v4-page-title')?.textContent.trim() ?? '';
      ok(afterTitle === (viaBasics ? 'Angaben & Grundlagen.' : 'Mein Plan.'), tag + ' «Zurück» führt zur übergeordneten Seite (→ «' + afterTitle + '»)');
    } else {
      ok(!headBack && !headClose, tag + ' Kopf ohne Rückweg-/Schliessen-Knopf');
    }
    out.push('      ' + tag + ': «' + title + '» · «' + (d.querySelector('.v4-page-context')?.textContent.trim() ?? '') + '»');
    f.remove();
  }
}

/* ---------- Detailseiten: Rückweg, Tabelle, funktionierendes «Übernehmen» ---------- */
async function editorChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(400);
  const before = d.querySelector('.v4-tiles')?.textContent ?? '';
  await openEditor(d, 'need');
  titleChecks(d, win, tag + ' Bedarf-Editor', {context: true});
  const back = d.querySelector('.v4-head-back');
  ok(!!back && !!back.querySelector('svg') && /Zurück zu/.test(back.getAttribute('aria-label') ?? '') && back.hasAttribute('data-v4-back'), tag + ' Rückweg-Knopf im Kopf («' + (back?.getAttribute('aria-label') ?? '') + '»)');
  ok(d.querySelectorAll('#app .v4-head-back').length === 1 && !d.querySelector('#app .v4-head-close'), tag + ' genau ein Rückweg, kein «✕» auf dem Screen');
  ok(back?.textContent.trim() === 'Angaben & Grundlagen', tag + ' aus «Angaben & Grundlagen» geöffnet → Rückweg dorthin («' + (back?.textContent.trim() ?? '') + '»)');
  const table = d.querySelector('.v4-form-table');
  ok(!!table, tag + ' Editor als Tabelle');
  const labels = [...(table?.querySelectorAll('label') ?? [])];
  ok(labels.length >= 1, tag + ' Tabellenzeilen (' + labels.length + ')');
  ok(!!table?.querySelector('.v4-form-value .v4-form-unit'), tag + ' Werte rechts mit Einheitenspalte');
  const submit = d.querySelector('.v4-form-submit');
  ok(submit?.getAttribute('type') === 'submit', tag + ' «Übernehmen» ist ein Submit-Knopf (kein type="button")');
  const input = d.getElementById('need');
  if (input && submit) {
    input.value = '12000';
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    submit.click();
    await wait(700);
    const after = d.querySelector('.v4-tiles')?.textContent ?? '';
    ok(after !== before && /12'000/.test(after), tag + ' «Übernehmen» übernimmt den Wert (' + (after.match(/CHF [\d']+/g) ?? []).join(' / ') + ')');
    ok(!!d.querySelector('.v4-verdict'), tag + ' danach zurück auf «Mein Plan»');
  } else { ok(false, tag + ' Bedarf-Feld und Submit-Knopf vorhanden'); }
  /* Apply-and-return: «Zurück» ist reine Navigation – nichts wird gespeichert. */
  await openEditor(d, 'need');
  const untouched = d.getElementById('need');
  if (untouched) {
    untouched.value = '9\'999';
    untouched.dispatchEvent(new win.Event('input', {bubbles:true}));
    d.querySelector('.v4-head-back')?.click();
    await wait(700);
    ok(d.querySelector('.v4-page-title')?.textContent.trim() === 'Angaben & Grundlagen.', tag + ' «Zurück» führt zur übergeordneten Seite');
    d.querySelector('[data-menu-page="plan"]')?.click();
    await wait(500);
    const tiles = d.querySelector('.v4-tiles')?.textContent ?? '';
    ok(/12'000/.test(tiles) && !/9'999/.test(tiles), tag + ' «Zurück» speichert nichts (' + (tiles.match(/CHF [\d']+/g) ?? []).join(' / ') + ')');
  }
  /* Beschriftungen brechen nur an Wortgrenzen, der Kanton belegt im Editor nur den Code –
     sonst schrumpft die Label-Spalte und «Pensionierungsalter» wird silbenweise getrennt. */
  await openEditor(d, 'personal');
  /* Silbentrennung erkennen: mehr Zeilen als Wörter heisst, ein Wort wurde getrennt. */
  const labelLines = node => {
    let lines = 0;
    for (const child of node.childNodes) {
      if (child.nodeType !== 3 || !child.textContent.trim()) continue;
      const range = d.createRange(); range.selectNodeContents(child);
      lines = Math.max(lines, range.getClientRects().length);
    }
    return lines;
  };
  const labelWords = node => [...node.childNodes].filter(child => child.nodeType === 3).map(child => child.textContent.trim().split(/\s+/).filter(Boolean).length).reduce((a, b) => a + b, 0);
  const personalLabels = [...d.querySelectorAll('#v4DetailForm label')];
  ok(personalLabels.length >= 3, tag + ' Persönliche Angaben: ' + personalLabels.length + ' Felder');
  const split = personalLabels.filter(label => labelLines(label) > labelWords(label));
  ok(split.length === 0, tag + ' Editor-Labels ohne Silbentrennung' + (split.length ? ' (' + split.map(label => label.textContent.trim() + ': ' + labelLines(label) + ' Zeilen / ' + labelWords(label) + ' Wörter').join(', ') + ')' : ' (' + personalLabels.map(label => label.textContent.trim() + '=' + labelLines(label) + '/' + labelWords(label)).join(', ') + ')'));
  const labelColumn = Math.round(personalLabels[0]?.getBoundingClientRect().width ?? 0);
  ok(labelColumn >= 140, tag + ' Label-Spalte breit genug (' + labelColumn + ' px)');
  const cantonSelect = d.getElementById('canton');
  const cantonTrigger = d.querySelector('#v4DetailForm .canton-trigger');
  const triggerText = cantonTrigger?.textContent.trim() ?? '';
  ok(/^[A-Z]{2}/.test(triggerText) && !/Aargau|Zürich|Appenzell|Bern|Waadt/.test(triggerText), tag + ' Kanton im Editor nur als Code («' + triggerText + '», Wert: «' + (cantonSelect?.value ?? '–') + '»)');
  /* «Nettomiete» ist aus der Oberfläche entfernt. */
  await openEditor(d, 'extra');
  ok(!/Nettomiete/.test(d.body.textContent), tag + ' kein «Nettomiete» im Einkommens-Editor');
  ok(/Weitere Einnahmen/.test(d.body.textContent), tag + ' Feld heisst «Weitere Einnahmen»');
  f.remove();
}

/* ---------- Info-Dialoge: Betrag, Herkunft, Tabelle ---------- */
async function infoChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(400);
  const tiles = [...d.querySelectorAll('.v4-tile')];
  const expectations = [
    {index:0, title:'Einkommen netto / Monat', rows:['Einkommen brutto','Geschätzte Steuern','Einkommen netto'], must:/Einkommen brutto[\s\S]*Geschätzte Steuern[\s\S]*Einkommen netto/},
    {index:1, title:'Bedarf netto / Monat', rows:['Bedarf netto','Einkommen netto','Aus Vermögen'], must:/Bedarf netto[\s\S]*Einkommen netto = [\s\S]*aus Vermögen/},
    {index:2, title:'Aus Vermögen / Monat', rows:['Bedarf netto','Einkommen netto','Aus Vermögen'], must:/Bedarf netto[\s\S]*Einkommen netto = [\s\S]*/},
    {index:3, title:'Startkapital', rows:['PK-Kapital netto','Weiteres Kapital','Startkapital'], must:/PK-Kapital netto[\s\S]*Weiteres Kapital/}
  ];
  for (const entry of expectations) {
    tiles[entry.index]?.querySelector('.v3-info')?.click();
    await wait(160);
    const body = d.getElementById('v4ModalBody');
    const text = (body?.textContent ?? '').replace(/\s+/g, ' ');
    ok(!!body && entry.must.test(text), tag + ' ⓘ ' + entry.title + ' nennt Betrag, Werte und Herkunft');
    const missing = entry.rows.filter(row => !text.includes(row));
    ok(missing.length === 0, tag + ' ⓘ ' + entry.title + ' zeigt alle Kettenwerte' + (missing.length ? ' (fehlt: ' + missing.join(', ') + ')' : ''));
    ok(!!body?.querySelector('.v4-info-amount'), tag + ' ⓘ ' + entry.title + ' zeigt den Betrag prominent');
    ok(!!body?.querySelector('.v3-info-list'), tag + ' ⓘ ' + entry.title + ' ist tabellarisch');
    ok(/Herkunft|deine Angabe|aus deinen|Schnellstart/.test(text), tag + ' ⓘ ' + entry.title + ' nennt die Herkunft');
    /* Modal-Schliessen: nur das Tabler-«✕» in der dunkelgrünen Textfarbe, ohne Fläche. */
    if (entry.index === 0) {
      const close = d.querySelector('#v4Modal [data-modal-close]');
      const cs = close ? win.getComputedStyle(close) : null;
      const box = close?.getBoundingClientRect();
      const svg = close?.querySelector('svg');
      ok(close?.getAttribute('aria-label') === 'Schliessen', tag + ' «✕» mit aria-label «Schliessen»');
      ok(!!box && box.width >= 40 && box.height >= 40, tag + ' «✕» Touchfläche ≥ 40 × 40 px (' + Math.round(box?.width ?? 0) + '×' + Math.round(box?.height ?? 0) + ')');
      ok(!!cs && (cs.backgroundColor === 'rgba(0, 0, 0, 0)' || cs.backgroundColor === 'transparent'), tag + ' «✕» ohne Hintergrund im Normalzustand (' + cs?.backgroundColor + ')');
      ok(!!cs && parseFloat(cs.borderTopWidth) === 0 && cs.borderTopStyle === 'none', tag + ' «✕» ohne Rahmen (' + cs?.borderTopWidth + ' ' + cs?.borderTopStyle + ')');
      ok(!!cs && cs.boxShadow === 'none', tag + ' «✕» ohne Schatten (' + cs?.boxShadow + ')');
      ok(!!cs && cs.color === 'rgb(31, 98, 85)', tag + ' «✕» in der dunkelgrünen Textfarbe (' + cs?.color + ')');
      ok(!!svg && svg.getAttribute('width') === '22' && svg.getAttribute('height') === '22', tag + ' IconX 22 px (' + svg?.getAttribute('width') + ')');
      ok(!!svg && svg.getAttribute('stroke-width') === '1.7' && svg.getAttribute('stroke') === 'currentColor', tag + ' IconX Strichstärke 1,7 in Textfarbe (' + svg?.getAttribute('stroke-width') + ')');
    }
    /* Die Kette muss aufgehen: brutto − Steuern = netto, und die Einzelposten ergeben brutto. */
    if (entry.index === 0) {
      const read = root => [...(root?.querySelectorAll('.v3-info-list > div') ?? [])].map(row => ({label:row.querySelector('dt')?.textContent.trim() ?? '', value:Number((row.querySelector('dd')?.textContent ?? '').replace(/[^\d]/g, ''))}));
      const main = read(body);
      const gross = main.find(row => /^Einkommen brutto/.test(row.label))?.value ?? 0;
      const tax = main.find(row => /^Geschätzte Steuern/.test(row.label))?.value ?? 0;
      const net = main.find(row => /^Einkommen netto/.test(row.label))?.value ?? 0;
      ok(gross > 0 && gross - tax === net, tag + ' ⓘ Einkommen rechnet brutto − Steuern = netto (' + gross + ' − ' + tax + ' = ' + net + ')');
      const parts = read(body.querySelector('.v4-info-detail')).map(row => row.value);
      ok(parts.length > 0 && parts.reduce((a, b) => a + b, 0) === gross, tag + ' ⓘ Einkommen: Summe der Einnahmen = brutto (' + parts.join(' + ') + ' = ' + parts.reduce((a, b) => a + b, 0) + ' / ' + gross + ')');
      ok(!/Kapitalbezugssteuer/.test(text), tag + ' ⓘ Einkommen ohne Hinweis auf die einmalige Kapitalbezugssteuer');
      ok(!/Nettomiete/.test(text), tag + ' ⓘ Einkommen: «Einnahmen einzeln» ohne «Nettomiete»');
    }
    d.querySelector('[data-modal-close]')?.click();
    await wait(140);
  }
  f.remove();
}

/* ---------- Alle Editoren und alle Vermögenssektionen speichern wirklich ---------- */
async function saveChecks(w, h) {
  const values = {personal:['age','59'], ahv:['ahv','2600'], pension:['pk','480000'], extra:['other','300'], need:['need','9500'], assumptions:['targetAge','88']};
  for (const [page, [field, value]] of Object.entries(values)) {
    const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px ' + page;
    win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
    await wait(400);
    /* Editoren liegen hinter «Angaben & Grundlagen» – «Annahmen» hat einen eigenen Menüpunkt. */
    if (page === 'assumptions') { d.querySelector('[data-menu-page="assumptions"]')?.click(); await wait(400); }
    else await openEditor(d, page);
    const input = d.getElementById(field);
    const submit = d.querySelector('.v4-form-submit');
    if (!input || !submit) { ok(false, tag + ' Feld/Knopf vorhanden'); f.remove(); continue; }
    input.value = value;
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    submit.click();
    await wait(700);
    const title = d.querySelector('.v4-page-title')?.textContent.trim() ?? '';
    ok(!win.__v4LastError && title === 'Mein Plan.', tag + ' «Übernehmen» speichert und kehrt zurück' + (win.__v4LastError ? ' (Fehler: ' + win.__v4LastError + ')' : ''));
    f.remove();
  }
  // Vermögen: eine Tabelle, ein «Übernehmen» – Pflichtfelder füllen, optionale leer lassen
  {
    const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px Vermögen';
    win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
    await wait(400);
    await openEditor(d, 'assets');
    ok(d.querySelectorAll('#v4AssetForm').length === 1 && d.querySelectorAll('.v4-form-submit').length === 1, tag + ' genau eine Tabelle und eine Aktion');
    const fill = {cash:'11111'};
    for (const [name, value] of Object.entries(fill)) {
      const input = d.querySelector(`#v4AssetForm input[name="${name}"]`);
      if (input) { input.value = value; input.dispatchEvent(new win.Event('input', {bubbles:true})); }
    }
    d.querySelector('#v4AssetForm .v4-form-submit')?.click();
    await wait(800);
    const title = d.querySelector('.v4-page-title')?.textContent.trim() ?? '';
    ok(!win.__v4LastError && title === 'Mein Plan.', tag + ' «Übernehmen» speichert und kehrt zurück' + (win.__v4LastError ? ' (Fehler: ' + win.__v4LastError + ')' : ''));
    // Fehlerfall: ungültige Eingabe → Fehler sichtbar, kein stiller Abbruch
    await openEditor(d, 'assets');
    const invalid = d.querySelector('#v4AssetForm input[name="securities"]');
    invalid.value = 'abc';
    invalid.dispatchEvent(new win.Event('input', {bubbles:true}));
    d.querySelector('#v4AssetForm .v4-form-submit')?.click();
    await wait(600);
    const message = d.getElementById('v4Error')?.textContent ?? '';
    ok(message.length > 0 && d.querySelector('.v4-page-title')?.textContent.trim() === 'Vermögen.', tag + ' ungültiger Wert → Fehler sichtbar statt stillem Abbruch («' + message + '»)');
    // Leere Zeilen bleiben «nicht erfasst» und blockieren das Speichern nicht
    invalid.value = '';
    invalid.dispatchEvent(new win.Event('input', {bubbles:true}));
    d.querySelector('#v4AssetForm .v4-form-submit')?.click();
    await wait(700);
    ok(d.querySelector('.v4-page-title')?.textContent.trim() === 'Mein Plan.', tag + ' leere Zeilen lassen sich speichern');
    f.remove();
  }
  // Werte müssen im gespeicherten Stand liegen
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow;
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(400);
  await openEditor(d, 'assets');
  const assetValues = {cash:'11111', securities:'22222', propertyValue:'444444'};
  for (const [name, value] of Object.entries(assetValues)) {
    const input = d.querySelector(`#v4AssetForm input[name="${name}"]`);
    if (input) { input.value = value; input.dispatchEvent(new win.Event('input', {bubbles:true})); }
  }
  d.querySelector('#v4AssetForm .v4-form-submit')?.click();
  await wait(600);
  await wait(900);
  const stored = win.localStorage.getItem('retirement-v3-plan') ?? '';
  const missing = ['11111','22222','444444'].filter(entry => !stored.includes(entry));
  ok(missing.length === 0, w + 'px Vermögenswerte im Speicherstand' + (missing.length ? ' (fehlt: ' + missing.join(', ') + ')' : ''));
  f.remove();
}

  ok(new Set(values).size > 1, tag + ' Szenarien unterscheiden sich (' + values.join(' / ') + ')');
  ok(values.every(value => value !== 'CHF 0'), tag + ' nie dreimal CHF 0 (' + values.join(' / ') + ')');
  ok(values.every(value => /^reicht bis Alter \d+\+?$/.test(value) || /^Restvermögen CHF/.test(value)), tag + ' Wirkung «reicht bis Alter …» bzw. «Restvermögen …» (' + values.join(' / ') + ')');
  // Vorschau: antippen darf nichts speichern und nicht navigieren
  const impactBefore = d.getElementById('strategyImpact')?.textContent.trim() ?? '';
  d.querySelectorAll('[data-strategy]')[0]?.click();
  await wait(350);
  const impactAfter = d.getElementById('strategyImpact')?.textContent.trim() ?? '';
  ok(impactAfter !== impactBefore && /Vorsichtig/.test(impactAfter), tag + ' Vorschau rechnet sofort («' + impactAfter.slice(0, 52) + '…»)');
  ok(d.querySelector('details.v4-hebel-strategy')?.open === true, tag + ' aufgeklappte Auswahl bleibt nach dem Antippen offen');
  ok(!!d.querySelector('.v4-page-title') && /Plan optimieren/.test(d.querySelector('.v4-page-title').textContent), tag + ' Auswahl navigiert nicht (kein Sprung zu «Annahmen»)');
  ok(!/Annahmen öffnen|Strategie prüfen/.test(d.querySelector('#app').textContent), tag + ' keine Navigation zu «Annahmen» im Block');
  const selectedRow = d.querySelector('[data-strategy][aria-checked="true"]');
  ok(!!selectedRow && selectedRow.classList.contains('selected') && /Vorsichtig/.test(selectedRow.textContent), tag + ' Auswahl sichtbar markiert');
  await wait(900);
  const storedProfile = JSON.parse(win.localStorage.getItem('retirement-v3-plan') ?? '{}')?.state?.riskProfile;
  ok(storedProfile === beforeProfile, tag + ' Vorschau verändert den Plan nicht (Profil bleibt ' + beforeProfile + ')');
  // Erst «Strategie übernehmen» persistiert
  const adopt = d.getElementById('strategyAdopt');
  ok(!!adopt, tag + ' «Strategie übernehmen» erscheint bei abweichender Auswahl');
  adopt.click();
  await wait(900);
  const after = win.localStorage.getItem('retirement-v3-plan') ?? '';
  ok(/"riskProfile":"cautious"/.test(after), tag + ' Übernehmen speichert das Profil («cautious»)');
  ok(d.querySelector('.v4-page-title')?.textContent.trim() === 'Mein Plan.', tag + ' nach dem Übernehmen zurück auf «Mein Plan»');
  // Aktuelle Strategie → Knopf deaktiviert
  d.querySelector('[data-v4-next="improve"]')?.click();
  await wait(450);
  const disabled = d.querySelector('.v4-block-action[disabled]');
  ok(!!disabled && /aktuell/.test(disabled.textContent), tag + ' aktuelle Strategie: Knopf deaktiviert («' + (disabled?.textContent.trim() ?? '') + '»)');
  const again = d.querySelector('details.v4-hebel-strategy');
  ok(!!again && !again.open, tag + ' erneuter Eintritt zeigt die Strategie wieder zugeklappt');
  ok(new RegExp('Vorsichtig · Annahme').test(again?.querySelector('.v4-hebel-summary')?.textContent ?? ''), tag + ' Kopfzeile nennt die übernommene Strategie («' + (again?.querySelector('.v4-hebel-summary')?.textContent.replace(/\s+/g, ' ').trim() ?? '') + '»)');
  /* Nach der eigenen Wahl steht im Töpfe-Dialog die Herkunft «gewählt». */
  d.querySelector('.v4-head-back')?.click();
  await wait(450);
  d.querySelector('[data-v4-next="years"]')?.click();
  await wait(500);
  d.querySelector('[data-v4-action="pots"]')?.click();
  await wait(500);
  const adoptedCard = (d.querySelector('#v4Modal .v4-pot-strategy')?.textContent ?? '').replace(/\s+/g, ' ').trim();
  ok(/^Anlagestrategie\s*gewählt\s*Vorsichtig\s*2,5 % pro Jahr/.test(adoptedCard), tag + ' Töpfe-Dialog nach «Strategie übernehmen»: Herkunft «gewählt» («' + adoptedCard + '»)');
  ok(/"strategyChosen":true/.test(win.localStorage.getItem('retirement-v3-plan') ?? ''), tag + ' Herkunft der Strategie wird gespeichert');
  d.querySelector('[data-modal-close]')?.click();
  await wait(150);
  /* Annahmen: Prozentwerte mit Dezimalkomma, Beschriftung und Wert überlappen nie. */
  d.querySelector('.v4-head-back')?.click();
  await wait(400);
  d.querySelector('[data-menu-page="assumptions"]')?.click();
  await wait(450);
  const percentInputs = [...d.querySelectorAll('#v4DetailForm input[data-percent]')].map(input => ({name:input.name, value:input.value}));
  ok(percentInputs.length >= 2 && percentInputs.every(entry => /^\d+(,\d+)?$/.test(entry.value)), tag + ' Prozentfelder mit Dezimalkomma (' + percentInputs.map(entry => entry.name + '=' + entry.value).join(', ') + ')');
  const readonlyRows = [...d.querySelectorAll('.v4-readonly>div')].map(node => ({dt:node.querySelector('dt')?.getBoundingClientRect(), dd:node.querySelector('dd')?.getBoundingClientRect()}));
  ok(readonlyRows.length >= 2 && readonlyRows.every(({dt, dd}) => dt && dd && (dd.left >= dt.right - 1 || dd.top >= dt.bottom - 1)), tag + ' Beschriftung und Wert der Annahmen überlappen nicht (' + readonlyRows.length + ' Zeilen)');
  ok(/% pro Jahr/.test(d.querySelector('.v4-readonly')?.textContent ?? ''), tag + ' Anlagestrategie im Annahmen-Screen mit «% pro Jahr»');
  // Übernehmen mit Komma-Eingabe: Wert bleibt numerisch korrekt
  const inflation = d.getElementById('inflation');
  if (inflation) {
    inflation.value = '0,9';
    inflation.dispatchEvent(new win.Event('input', {bubbles:true}));
    d.querySelector('.v4-form-submit')?.click();
    await wait(800);
    const stored = win.localStorage.getItem('retirement-v3-plan') ?? '';
    const found = (stored.match(/"inflation":\s*[^,}]+/) ?? ['–'])[0];
    ok(/"inflation":0\.9/.test(stored), tag + ' Komma-Eingabe wird numerisch übernommen («0,9 %» → 0.9; gespeichert: ' + found + ', Fehler: ' + (d.getElementById('v4Error')?.textContent || '–') + ')');
  } else { ok(false, tag + ' Feld «Inflation» vorhanden'); }
  f.remove();
}

async function separatorChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(400);
  await openEditor(d, 'extra');
  const input = d.querySelector('input[name="additional"]');
  ok(!!input?.hasAttribute('data-amount'), tag + ' Betragsfeld mit Tausenderlogik');
  if (input) {
    // Ziffern in der Mitte einfügen – Gruppierung muss erhalten bleiben
    input.value = "1'000";
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    input.focus();
    input.setSelectionRange(1, 1);
    input.value = '11' + input.value.slice(1);
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    ok(/^1'100$|^11'000$/.test(input.value), tag + ' Gruppierung bleibt beim Tippen in der Mitte («' + input.value + '»)');
    input.value = '1234567';
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    ok(input.value === "1'234'567", tag + ' siebenstelliger Betrag gruppiert («' + input.value + '»)');
  }
  f.remove();
}

async function assumptionsChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['vollstaendig']());
  // Unplausibler Altbestand: Wertschriftenrendite 16 %
  const record = JSON.parse(win.localStorage.getItem('retirement-v3-plan'));
  record.state.details.assumptions = {...(record.state.details.assumptions ?? {}), secReturn:16};
  win.localStorage.setItem('retirement-v3-plan', JSON.stringify(record));
  await wait(200);
  win.V4.load();
  await wait(400);
  d.querySelector('[data-menu-page="assumptions"]')?.click();
  await wait(450);
  ok(!d.querySelector('input[name="secReturn"]'), tag + ' Wertschriftenrendite ist kein Eingabefeld mehr');
  const readonly = d.querySelector('#v4DetailForm .v4-readonly') ?? d.querySelector('.v4-readonly');
  ok(!!readonly, tag + ' Expertenbereich zeigt die Renditeherkunft');
  const readText = readonly?.textContent.replace(/\s+/g, ' ').trim() ?? '';
  ok(/Anlagestrategie/.test(readText) && /einzige Renditequelle im Ruhestand/.test(readText), tag + ' Strategie als einzige Renditequelle ausgewiesen');
  ok(/Wertschriftenrendite bis Pensionierung/.test(readText) && /16 %/.test(readText), tag + ' interner Satz mit Wert sichtbar («' + readText.slice(0, 60) + '…»)');
  const warning = d.querySelector('.v4-warning');
  ok(!!warning && /16 %/.test(warning.textContent) && /zu prüfen/.test(warning.textContent), tag + ' 16 % als verdächtig markiert');
  const reset = d.querySelector('[data-reset-sec-return]');
  ok(!!reset, tag + ' Zurücksetzen auf den Standardwert angeboten');
  reset?.click();
  await wait(800);
  const stored = win.localStorage.getItem('retirement-v3-plan') ?? '';
  ok(/"secReturn":4.5/.test(stored), tag + ' Zurücksetzen schreibt 4,5 % in den Stand');
  ok(!d.querySelector('.v4-warning'), tag + ' Warnung verschwindet nach dem Zurücksetzen');
  f.remove();
}

/* ---------- Restvermögen am Planungshorizont: identisch in Strategie, Varianten und Jahresansicht ---------- */
async function horizonChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['optimiert']()); win.V4.load();
  await wait(450);
  d.querySelector('[data-v4-next="improve"]')?.click();
  await wait(500);
  const outcome = d.querySelector('.v4-strategy.current .v4-strategy-outcome')?.textContent.trim() ?? '';
  const allReach = /^Restvermögen CHF/.test(outcome);
  const row = outcome.replace(/^Restvermögen /, '');
  d.querySelector('[data-v4-back]')?.click();
  await wait(400);
  d.querySelector('[data-v4-next="years"]')?.click();
  await wait(500);
  const range = d.getElementById('yearRange');
  if (range) { range.value = range.max; range.dispatchEvent(new win.Event('input', {bubbles:true})); }
  await wait(500);
  const lines = [...d.querySelectorAll('.v4-year-line')].map(node => ({label:node.querySelector('span')?.textContent.replace(/\s+/g, ' ').trim() ?? '', value:node.querySelector('strong')?.textContent.trim() ?? '', text:node.textContent.replace(/\s+/g, ' ').trim()}));
  const endBlock = [...d.querySelectorAll('.v4-year-block')].find(block => /Vermögen am Jahresende/.test(block.textContent)) ?? null;
  const total = endBlock?.querySelector('.v4-year-line strong')?.textContent.trim() ?? '';
  /* Das letzte Planjahr endet auf dem Planungshorizont: «Total» IST der Horizontwert –
     eine zweite Zeile «= Restvermögen am Planungshorizont» wäre dieselbe Zahl doppelt. */
  const duplicate = lines.find(line => /Restvermögen am Planungshorizont/.test(line.text)) ?? null;
  ok(!duplicate, tag + ' keine doppelte Restvermögens-Zeile unter «Vermögen am Jahresende»');
  ok(endBlock?.querySelectorAll('.v4-year-line').length === 2, tag + ' Abschnitt 6 zeigt Total und Veränderung (' + (endBlock?.querySelectorAll('.v4-year-line').length ?? 0) + ' Zeilen)');
  ok(!!total, tag + ' Vermögen am Jahresende des letzten Planjahres ausgewiesen (' + total + ')');
  if (allReach) ok(!!total && total === row, tag + ' Strategie zeigt dieselbe Zahl wie die Jahresansicht (' + row + ' / ' + total + ')');
  else out.push('      ' + tag + ' Strategie zeigt Reichweite statt Restvermögen (' + (outcome || '–') + ') – Konsistenz nur gegen die Jahresansicht geprüft');
  f.remove();
}

/* ---------- Jahresansicht: verwendete Strategie + Überleitung zum Vorjahr ---------- */
async function yearDetailChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  win.DevFixture.write(win.DevFixture.scenarios['optimiert']()); win.V4.load();
  await wait(450);
  d.querySelector('[data-v4-next="years"]')?.click();
  await wait(500);
  const blocks = () => [...d.querySelectorAll('.v4-year-block')];
  const blockOf = needle => blocks().find(block => new RegExp(needle).test(block.querySelector('h3')?.textContent ?? ''));
  const first = blockOf('Vermögen am Jahresanfang');
  ok(!!first && !first.querySelector('.v4-year-carry'), tag + ' keine Währungsumrechnungs-Zeile mehr');
  /* Jahresnavigation: zwei Schrittknöpfe (± 1 Jahr), an den Enden deaktiviert. */
  const range = d.getElementById('yearRange');
  const stepButtons = [...d.querySelectorAll('.v4-year-nav [data-year-step]')];
  const yearLabel = () => d.querySelector('.v4-year-nav .v4-detail-state')?.textContent.trim() ?? '';
  const sliderValue = () => Number(d.getElementById('yearRange')?.value ?? -1);
  const yearTotal = () => d.querySelector('.v4-year-block strong')?.textContent.trim() ?? '';
  ok(stepButtons.length === 2 && stepButtons.every(button => !!button.querySelector('svg')), tag + ' Jahresnavigation mit zwei Schrittknöpfen (' + stepButtons.length + ')');
  ok(stepButtons.every(button => /^Ein Jahr (früher|später)$/.test(button.getAttribute('aria-label') ?? '')), tag + ' Schrittknöpfe mit aria-label (' + stepButtons.map(button => button.getAttribute('aria-label')).join(' / ') + ')');
  range.value = range.min; range.dispatchEvent(new win.Event('input', {bubbles:true}));
  await wait(400);
  const startSlider = sliderValue(), startLabel = yearLabel(), startTotal = yearTotal();
  ok(d.querySelector('[data-year-step="-1"]')?.disabled === true, tag + ' im ersten Planjahr ist «früher» deaktiviert');
  d.querySelector('[data-year-step="1"]')?.click();
  await wait(400);
  ok(sliderValue() === startSlider + 1 && yearLabel() !== startLabel && yearTotal() !== startTotal, tag + ' «später» springt genau ein Jahr weiter (' + startLabel + ' → ' + yearLabel() + ')');
  ok(d.querySelector('[data-year-step="-1"]')?.disabled === false, tag + ' nach dem ersten Schritt ist «früher» aktiv');
  d.querySelector('[data-year-step="-1"]')?.click();
  await wait(400);
  ok(sliderValue() === startSlider && yearTotal() === startTotal, tag + ' «früher» stellt dasselbe Jahr wieder her (' + yearLabel() + ')');
  range.value = range.max; range.dispatchEvent(new win.Event('input', {bubbles:true}));
  await wait(400);
  ok(d.querySelector('[data-year-step="1"]')?.disabled === true, tag + ' im letzten Planjahr ist «später» deaktiviert');
  ok(d.querySelector('[data-year-step="-1"]')?.disabled === false, tag + ' im letzten Planjahr bleibt «früher» aktiv');
  range.value = range.min; range.dispatchEvent(new win.Event('input', {bubbles:true}));
  await wait(400);
  // Reale Sicht: Jahresende des Vorjahres = Eröffnung des Folgejahres (kein Sprung)
  const ages = [...Array(Number(range.max) - Number(range.min) + 1)].map((_, i) => Number(range.min) + i);
  const readYear = async age => {
    range.value = String(age); range.dispatchEvent(new win.Event('input', {bubbles:true}));
    await wait(400);
    const startBlock = blockOf('Vermögen am Jahresanfang');
    const endBlock = blockOf('Vermögen am Jahresende');
    const blockTotal = block => (block?.querySelector('.v4-year-line strong')?.textContent.trim() ?? '');
    const allLines = [...(endBlock?.querySelectorAll('.v4-year-line') ?? [])].map(node => ({label:node.querySelector('span')?.textContent.replace(/\s+/g, ' ').trim() ?? '', value:node.querySelector('strong')?.textContent.trim() ?? ''}));
    return {start:blockTotal(startBlock), end:blockTotal(endBlock), lines:allLines};
  };
  const secondLast = await readYear(ages[ages.length - 2]);
  const last = await readYear(ages[ages.length - 1]);
  ok(!!secondLast.end && secondLast.end === last.start, tag + ' keine Lücke zwischen den Jahren (' + secondLast.end + ' = ' + last.start + ')');
  const footer = [...d.querySelectorAll('#app .v4-lead')].map(node => node.textContent).join(' ');
  ok(/heutiger Kaufkraft/.test(footer) && !/nominale CHF dieses Jahres/.test(footer), tag + ' Fusszeile nennt die reale Sicht');
  // Steuerzeile bleibt in sich stimmig (Satz × Basis ≈ Betrag)
  const incomeLines = [...(blockOf('Einkommen')?.querySelectorAll('.v4-year-line') ?? [])].map(node => ({label:node.querySelector('span')?.textContent.replace(/\s+/g, ' ').trim() ?? '', value:node.querySelector('strong')?.textContent.trim() ?? ''}));
  const before = incomeLines.find(line => /Einnahmen vor Steuern/.test(line.label))?.value ?? '';
  const taxLine = incomeLines.find(line => /^Steuern/.test(line.label)) ?? {label:'', value:''};
  const rate = Number((taxLine.label.match(/([\d.,]+) %/) ?? [])[1]?.replace(',', '.')) ?? 0;
  const number = text => Number(String(text).replace(/[^\d]/g, '')) || 0;
  const expected = Math.round(number(before) * rate / 100);
  ok(!!before && Math.abs(expected - number(taxLine.value)) <= 2, tag + ' Steuerzeile stimmt (Satz ' + rate + ' % von ' + before + ' ≈ ' + taxLine.value + ')');
  const pots = blockOf('Deine Töpfe');
  const strategy = pots?.querySelector('.v4-year-strategy')?.textContent.replace(/\s+/g, ' ').trim() ?? '';
  ok(/^Ausgewogen · Annahme 4,5 % pro Jahr/.test(strategy), tag + ' Abschnitt 5 nennt die verwendete Strategie («' + strategy + '»)');
  ok(!!pots?.querySelector('.v4-year-strategy .v3-modal-icon'), tag + ' Strategie-Zeile mit ⓘ');
  const potsLines = [...(pots?.querySelectorAll('.v4-year-line') ?? [])].map(node => node.querySelector('span')?.textContent.trim() ?? '');
  ok(potsLines.some(label => /Rendite dieses Jahres/.test(label)), tag + ' «Rendite dieses Jahres» bleibt erhalten');
  // Dynamik: Strategie wechseln → Zeile folgt
  d.querySelector('[data-v4-back]')?.click();
  await wait(400);
  d.querySelector('[data-v4-next="improve"]')?.click();
  await wait(500);
  d.querySelector('details.v4-hebel-strategy summary')?.click();
  await wait(280);
  d.querySelector('[data-strategy="cautious"]')?.click();
  await wait(400);
  d.getElementById('strategyAdopt')?.click();
  await wait(900);
  d.querySelector('[data-v4-next="years"]')?.click();
  await wait(500);
  const cautious = blockOf('Deine Töpfe')?.querySelector('.v4-year-strategy')?.textContent.replace(/\s+/g, ' ').trim() ?? '';
  ok(/^Vorsichtig · Annahme 2,5 % pro Jahr/.test(cautious), tag + ' Strategie-Zeile folgt dem Profil («' + cautious + '»)');
  f.remove();
}

(async () => {
  /* Zwischenstand nach jedem Block schreiben: so bleibt auch bei einem Abbruch sichtbar,
     wie weit die Prüfungen gekommen sind. */
  const flush = () => { document.getElementById('report').textContent = out.join('\n'); };
  for (const [w, h] of [[360,780],[390,844],[430,900],[1000,900]]) {
    try { await startChecks(w, h, 'pre'); await startChecks(w, h, 'post'); } catch (e) { ok(false, w + ' Schnellstart: ' + e.message); }
    flush();
  }
  flush();
  for (const [w, h] of [[390,844],[430,900],[1000,900]]) {
    try { await planStructure(w, h); } catch (e) { ok(false, w + ' Mein Plan: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await screenChecks(w, h); } catch (e) { ok(false, w + ' Screens: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await editorChecks(w, h); } catch (e) { ok(false, w + ' Editor: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await infoChecks(w, h); } catch (e) { ok(false, w + ' Info-Dialoge: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await saveChecks(w, h); } catch (e) { ok(false, w + ' Speichern: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await improveChecks(w, h); } catch (e) { ok(false, w + ' Plan präzisieren: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await optimizeChecks(w, h); } catch (e) { ok(false, w + ' Plan optimieren: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await navigationChecks(w, h); } catch (e) { ok(false, w + ' Navigation/IA: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await threeAChecks(w, h); } catch (e) { ok(false, w + ' Säule 3a: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await strategyChecks(w, h); } catch (e) { ok(false, w + ' Strategie: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await separatorChecks(w, h); } catch (e) { ok(false, w + ' Separator: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await assumptionsChecks(w, h); } catch (e) { ok(false, w + ' Annahmen: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await horizonChecks(w, h); } catch (e) { ok(false, w + ' Horizontwert: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await yearDetailChecks(w, h); } catch (e) { ok(false, w + ' Jahresansicht: ' + e.message); }
  }
  try { await modalCloseStyleChecks(); } catch (e) { ok(false, 'Modal-Schliessen (CSS): ' + e.message); }
  const fails = out.filter(l => l.startsWith('FAIL')).length;
  document.getElementById('report').textContent = out.join('\n') + '\n---\n' + (fails ? fails + ' FAIL' : 'ALLE CHECKS PASS');
})();
