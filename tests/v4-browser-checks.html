/* ---------- «Rente oder Kapital?»: Variantenvergleich ----------
   Prüft die Acceptance Criteria des Vergleichsscreens: aktueller Plan links und grün, Auswahl nur
   aus den übrigen Varianten, beide Karten nebeneinander, Grün/Blau konsistent, Grafik aus der
   bestehenden Jahresprojektion ohne CHF-Y-Achse, Aufbrauchmarke, Umschalter Vermögen/Einkommen,
   Detailwerte, Beratungs-CTA und Berechnungsbasis – und dass der Vergleich den Plan nicht ändert. */
async function comparisonChecks(w, h) {
  const f = await frame(w, h), d = f.contentDocument, win = f.contentWindow, tag = w + 'px';
  const cssValue = name => win.getComputedStyle(d.documentElement).getPropertyValue(name).trim();
  const hexToRgb = hex => {
    const match = String(hex).trim().match(/^#?([0-9a-f]{6})$/i);
    if (!match) return '';
    const value = parseInt(match[1], 16);
    return 'rgb(' + ((value >> 16) & 255) + ', ' + ((value >> 8) & 255) + ', ' + (value & 255) + ')';
  };
  const green = hexToRgb(cssValue('--v3-green')), blue = hexToRgb(cssValue('--v3-pot-bonds'));
  const digits = text => Number(String(text).replace(/[^\d]/g, ''));
  const store = () => { try { return JSON.parse(win.localStorage.getItem('retirement-v3-plan') ?? '{}'); } catch (error) { return {}; } };
  win.DevFixture.write(win.DevFixture.scenarios['optimiert']()); win.V4.load();
  await wait(500);
  const statusReach = (d.querySelector('.v4-verdict')?.textContent.match(/bis Alter (\d+)/) ?? [])[1] ?? '';
  const shareBefore = store()?.state?.details?.pension?.pkShare, strategyBefore = store()?.state?.riskProfile;
  /* 1) Einstieg im PK-Bereich auf «Mein Plan» – kein neuer Menüpunkt */
  const entry = d.querySelector('.v4-lever [data-v4-next="compare"]');
  ok(!!entry && /^Rente oder Kapital\?/.test(entry.textContent.trim()) && /Vergleiche deinen Plan mit einer anderen Variante/.test(entry.textContent), tag + ' Action-Card «Rente oder Kapital?» im PK-Bereich (' + (entry?.textContent.trim() ?? 'fehlt') + ')');
  ok(!d.querySelector('[data-menu-page="compare"]') && !/Rente oder Kapital/.test(d.getElementById('v4Menu')?.textContent ?? ''), tag + ' kein neuer Menüpunkt im Hamburger');
  entry?.click();
  await wait(650);
  /* 2) Kopf: Titel, Kontext, genau ein Rückweg */
  ok(d.querySelector('.v4-page-title')?.textContent.trim() === 'Rente oder Kapital?', tag + ' Titel «Rente oder Kapital?»');
  ok(d.querySelector('.v4-page-context')?.textContent.trim() === 'Zwei Varianten im Vergleich.', tag + ' Kontext nennt den Vergleich');
  ok(d.querySelector('.v4-head-back')?.textContent.trim() === 'Mein Plan' && !d.querySelector('.v4-head-close'), tag + ' genau ein Rückweg «Mein Plan», kein «✕»');
  /* 3) Zwei Karten nebeneinander; aktueller Plan links, grün, exakt «Aktueller Plan» */
  const cardsOf = () => [...d.querySelectorAll('.v4-cmp-card')];
  const firstCards = cardsOf();
  ok(firstCards.length === 2, tag + ' genau zwei Variantenkarten (' + firstCards.length + ')');
  const boxCurrent = firstCards[0]?.getBoundingClientRect(), boxSecond = firstCards[1]?.getBoundingClientRect();
  ok(boxCurrent.right <= boxSecond.left + 1 && Math.abs(boxCurrent.top - boxSecond.top) <= 1, tag + ' Karten stehen nebeneinander (' + Math.round(boxCurrent.width) + ' + ' + Math.round(boxSecond.width) + ' px @ ' + w + ')');
  ok(boxSecond.right <= d.documentElement.clientWidth + 0.5, tag + ' Karten passen in die Breite (' + Math.round(boxSecond.right) + ' ≤ ' + d.documentElement.clientWidth + ')');
  ok(firstCards[0]?.classList.contains('current') && /^Aktueller Plan/.test(firstCards[0].textContent.trim()) && !/Dein aktueller Plan/.test(firstCards[0].textContent), tag + ' linke Karte heisst exakt «Aktueller Plan»');
  ok(/^Variante/.test(firstCards[1]?.textContent.trim() ?? '') && !/Zweite Variante/.test(d.querySelector('.v4-cmp')?.textContent ?? ''), tag + ' rechte Karte heisst «Variante» (ohne «Zweite»)');
  ok(win.getComputedStyle(firstCards[0]).borderTopColor === green, tag + ' aktueller Plan grün umrandet (' + win.getComputedStyle(firstCards[0]).borderTopColor + ')');
  ok(win.getComputedStyle(firstCards[1]).borderTopColor === blue, tag + ' Vergleichsvariante blau umrandet (' + win.getComputedStyle(firstCards[1]).borderTopColor + ')');
  const metricsOf = card => [...card.querySelectorAll('.v4-cmp-values dt')].map(node => node.textContent.replace(/\s+/g, ' ').trim());
  ok(JSON.stringify(metricsOf(firstCards[0])) === JSON.stringify(['Startkapital netto', 'PK-Rente netto / Mt.', 'Vermögen reicht bis']), tag + ' genau drei Kernwerte je Karte (' + metricsOf(firstCards[0]).join(' | ') + ')');
  ok(firstCards.every(card => card.querySelectorAll('.v4-cmp-values div').length === 3 && [...card.querySelectorAll('.v4-cmp-values dd')].every(node => node.textContent.trim().length > 0)), tag + ' keine vierte Kennzahl, alle Werte gefüllt');
  const rowsLeft = [...firstCards[0].querySelectorAll('.v4-cmp-values dt')].map(node => Math.round(node.getBoundingClientRect().top));
  const rowsRight = [...firstCards[1].querySelectorAll('.v4-cmp-values dt')].map(node => Math.round(node.getBoundingClientRect().top));
  ok(JSON.stringify(rowsLeft) === JSON.stringify(rowsRight), tag + ' Kennzahlen beider Karten exakt ausgerichtet (' + rowsLeft.join('/') + ' vs ' + rowsRight.join('/') + ')');
  /* Referenzbreiten sind 390–440 px; darunter bricht der Text stärker um. */
  const screenHeight = d.getElementById('app')?.getBoundingClientRect().height ?? 0;
  if (w >= 390) ok(screenHeight <= h * 1.05, tag + ' Übersicht passt auf einen Screen (' + Math.round(screenHeight) + ' px / ' + h + ' px = ' + (screenHeight / h).toFixed(2) + ')');
  else out.push('      ' + tag + ' Übersicht braucht ' + (screenHeight / h).toFixed(2) + ' Screens (Referenz 390–440 px: 1,00)');
  const badgeBox = firstCards[1].querySelector('.v4-cmp-badge')?.getBoundingClientRect(), selectBox = firstCards[1].querySelector('select')?.getBoundingClientRect();
  ok(!!badgeBox && !!selectBox && selectBox.top >= badgeBox.bottom - 1, tag + ' Auswahl überdeckt den Badge nicht (' + Math.round(badgeBox.bottom) + ' ≤ ' + Math.round(selectBox.top) + ')');
  /* 4) Auswahl: nur die übrigen gespeicherten Varianten */
  const select = d.querySelector('[data-cmp-share]');
  const options = [...(select?.options ?? [])].map(option => Number(option.value));
  ok(!!select && options.length === 2 && !options.includes(Number(shareBefore)), tag + ' Auswahl bietet nur andere Varianten (' + options.join(', ') + '; aktuell ' + shareBefore + ' %)');
  ok(/^Variante/.test(firstCards[1].textContent.trim()), tag + ' die Auswahl sitzt auf der zweiten Karte');
  /* 5) Grafik: aus der bestehenden Projektion, ohne CHF-Y-Achse, mit Aufbrauchmarke */
  const chart = d.querySelector('.v4-cmp-chart');
  const pillsOf = () => [...d.querySelectorAll('.v4-cmp-chart .pill text')].map(node => node.textContent.trim());
  const model = win.V4.comparisonOf(win.V4.evaluated(Number(shareBefore)), Number(shareBefore));
  const pills = pillsOf();
  const currentPills = [...d.querySelectorAll('.v4-cmp-chart .pill-current text')].map(node => node.textContent.trim());
  ok(!!chart && pills.length >= 4, tag + ' zwei Linien mit direkten Wertelabels (' + pills.length + ')');
  ok(currentPills.some(text => digits(text) === Math.round(model.series[0].assets)), tag + ' Marke des aktuellen Plans stammt aus der Jahresprojektion (' + Math.round(model.series[0].assets) + '; Labels ' + currentPills.join(' | ') + ')');
  const chartTexts = [...d.querySelectorAll('.v4-cmp-chart text')].map(node => node.textContent.trim());
  ok(chartTexts.filter(text => /CHF/.test(text)).length === pills.filter(text => /^CHF/.test(text)).length, tag + ' CHF steht nur an den Wertelabels (' + chartTexts.filter(text => /CHF/.test(text)).length + '), nicht auf einer Y-Achse');
  ok(!chartTexts.some(text => /1'000'000|750'000|500'000|250'000/.test(text)), tag + ' keine platzraubende CHF-Y-Achse (' + chartTexts.filter(text => /CHF/.test(text)).slice(0, 3).join(' / ') + ' …)');
  ok(!!d.querySelector('.v4-cmp-chart .line-current') && !!d.querySelector('.v4-cmp-chart .line-second'), tag + ' zwei Linien in der Grafik');
  ok(win.getComputedStyle(d.querySelector('.v4-cmp-chart .line-current')).stroke === green && win.getComputedStyle(d.querySelector('.v4-cmp-chart .line-second')).stroke === blue, tag + ' Linienfarben grün/blau wie die Karten');
  ok(pills.some(text => /^0 mit \d+$/.test(text)), tag + ' Aufbrauch des Vermögens direkt an der Linie (' + pills.filter(text => /^0 mit/.test(text)).join(', ') + ')');
  const pillBoxes = [...d.querySelectorAll('.v4-cmp-chart .pill rect')].map(node => node.getBoundingClientRect());
  /* Berührung gilt nicht als Überdeckung – erst mehr als 1 px in beiden Achsen. */
  const collided = pillBoxes.filter((box, index) => pillBoxes.slice(index + 1).some(other => box.right - other.left > 1 && other.right - box.left > 1 && box.bottom - other.top > 1 && other.bottom - box.top > 1));
  ok(pillBoxes.length >= 4 && collided.length === 0, tag + ' keine überdeckten Wertelabels (' + pillBoxes.length + ' Labels, ' + collided.length + ' Überdeckungen)');
  ok(pillBoxes.length <= 6, tag + ' höchstens drei Wertelabels je Linie (' + pillBoxes.length + ' insgesamt)');
  /* Keine Linie darf durch ein Wertelabel laufen – in SVG-Koordinaten geprüft. */
  const pillSvgBoxes = [...d.querySelectorAll('.v4-cmp-chart .pill rect')].map(node => ({x:Number(node.getAttribute('x')), y:Number(node.getAttribute('y')), w:Number(node.getAttribute('width')), h:Number(node.getAttribute('height'))}));
  const linePoints = [...d.querySelectorAll('.v4-cmp-chart path')].map(node => (node.getAttribute('d') ?? '').split(/[ML]/).filter(Boolean).map(pair => pair.trim().split(/\s+/).map(Number)));
  const crossedLabels = pillSvgBoxes.filter(box => linePoints.some(points => points.some(([px, py]) => px > box.x && px < box.x + box.w && py > box.y && py < box.y + box.h)));
  ok(crossedLabels.length === 0, tag + ' keine Linie läuft durch ein Wertelabel (' + crossedLabels.length + ' von ' + pillSvgBoxes.length + ')');
  /* Unter jedem Punkt steht ein Alter: die Achsenzahlen decken alle Marker ab. */
  const dotXs = [...d.querySelectorAll('.v4-cmp-chart circle')].map(node => Number(node.getAttribute('cx')));
  const tickXs = [...d.querySelectorAll('.v4-cmp-chart text.tick')].map(node => Number(node.getAttribute('x')));
  const unlabelled = dotXs.filter(cx => !tickXs.some(x => Math.abs(x - cx) < 0.8));
  ok(dotXs.length >= 4 && unlabelled.length === 0, tag + ' unter jedem Punkt steht ein Alter (' + dotXs.length + ' Punkte, ' + unlabelled.length + ' ohne Zahl)');
  const crowded = tickXs.filter((x, index) => tickXs.slice(index + 1).some(other => Math.abs(other - x) < 16));
  ok(crowded.length === 0, tag + ' Achsenzahlen stehen nicht zu eng (' + tickXs.length + ' Zahlen)');
  /* Jede Achsenzahl gehört zu einem Punkt: keine zusätzlichen Jahrzehnt-Werte. */
  const tickList = [...d.querySelectorAll('.v4-cmp-chart text.tick')].map(node => ({age:Number(node.textContent), x:Number(node.getAttribute('x'))}));
  const tickAgeAt = x => (tickList.find(entry => Math.abs(entry.x - x) < 0.8) ?? {}).age ?? null;
  const tickAges = tickList.map(entry => entry.age).sort((p, q) => p - q);
  const horizonAge = tickAges[tickAges.length - 1];
  const strayTicks = tickList.filter(entry => entry.age !== horizonAge && !dotXs.some(cx => Math.abs(cx - entry.x) < 0.8));
  ok(strayTicks.length === 0, tag + ' jede Achsenzahl steht unter einem Punkt (' + tickList.map(entry => entry.age).join(' · ') + ')');
  ok(tickList.length <= new Set(dotXs).size + 1, tag + ' keine zusätzlichen Achsenzahlen ohne Punkt (' + tickList.length + ' Zahlen, ' + new Set(dotXs).size + ' Punktalter)');
  /* Wertelabels sitzen waagerecht genau über ihrem Datenpunkt; nur am Chartrand rutschen sie an
     die Kante und bekommen dann eine Leader-Line. */
  const chartW = Number((chart?.getAttribute('viewBox') ?? '').split(/\s+/)[2]) || 0;
  const pillSvg = [...d.querySelectorAll('.v4-cmp-chart .pill')].map(group => {
    const rect = group.querySelector('rect');
    return {tone:[...group.classList].find(name => name.startsWith('pill-')).replace('pill-', ''),
      text:group.querySelector('text').textContent.trim(),
      x:Number(rect.getAttribute('x')), y:Number(rect.getAttribute('y')), w:Number(rect.getAttribute('width')), h:Number(rect.getAttribute('height'))};
  });
  const dotsTone = tone => [...d.querySelectorAll('.v4-cmp-chart .dot-' + tone)].map(node => ({x:Number(node.getAttribute('cx')), y:Number(node.getAttribute('cy'))}));
  const dotsByTone = {current:dotsTone('current'), second:dotsTone('second')};
  const nearestDot = (tone, cx) => (dotsByTone[tone] ?? []).reduce((best, dot) => Math.abs(dot.x - cx) < Math.abs(best.x - cx) ? dot : best, {x:0, y:0});
  const offCentre = [], belowLine = [];
  pillSvg.forEach(pill => {
    const centre = pill.x + pill.w / 2, dot = nearestDot(pill.tone, centre);
    const centred = Math.abs(dot.x - centre) < 0.6;
    const clamped = pill.x <= 2.5 || pill.x + pill.w >= chartW - 2.5;
    if (!centred && !clamped) offCentre.push(pill.text + ' (' + Math.round(centre - dot.x) + ' px)');
    if (pill.y + pill.h > dot.y + 0.5) belowLine.push(pill.text);
  });
  ok(offCentre.length === 0, tag + ' Wertelabels sitzen mittig über ihrem Punkt oder an der Chartkante (' + (offCentre.join(', ') || 'alle mittig') + ')');
  ok(belowLine.length === 0, tag + ' Wertelabels stehen über ihrer Linie (' + (belowLine.join(', ') || pillSvg.length + ' Labels') + ')');
  const shifted = pillSvg.filter(pill => Math.abs(nearestDot(pill.tone, pill.x + pill.w / 2).x - (pill.x + pill.w / 2)) >= 0.6).length;
  const leaderCount = d.querySelectorAll('.v4-cmp-chart .leader').length;
  ok(leaderCount === shifted, tag + ' Leader-Line nur für verschobene Labels (' + leaderCount + ' Linien / ' + shifted + ' verschobene Labels)');
  ['current', 'second'].forEach(tone => {
    const own = pillSvg.filter(pill => pill.tone === tone).length;
    ok(own <= 3, tag + ' höchstens drei Wertelabels auf der ' + (tone === 'current' ? 'grünen' : 'blauen') + ' Linie (' + own + ')');
  });
  /* Beschriftet werden nur Start, gemeinsamer Vergleichszeitpunkt und das jeweilige Ende – und
     die beiden gemeinsamen Zeitpunkte tragen beide Linien. */
  const labelledAges = tone => pillSvg.filter(pill => pill.tone === tone).map(pill => tickAgeAt(nearestDot(tone, pill.x + pill.w / 2).x)).filter(age => age !== null);
  const dotAges = tone => dotsByTone[tone].map(dot => tickAgeAt(dot.x)).filter(age => age !== null);
  const span = [...new Set([...dotAges('current'), ...dotAges('second')])].sort((p, q) => p - q);
  const startAge = span[0], lastAge = span[span.length - 1];
  const midAge = span.reduce((best, age) => Math.abs(age - (startAge + lastAge) / 2) < Math.abs(best - (startAge + lastAge) / 2) ? age : best, startAge);
  ['current', 'second'].forEach(tone => {
    const own = dotAges(tone), ownEnd = own.length ? own[own.length - 1] : lastAge;
    const unexpected = labelledAges(tone).filter(age => ![startAge, midAge, ownEnd].includes(age));
    ok(unexpected.length === 0, tag + ' die ' + (tone === 'current' ? 'grüne' : 'blaue') + ' Linie trägt nur Start, Vergleichszeitpunkt und ihr Ende (' + labelledAges(tone).join(' · ') + ')');
  });
  ok(labelledAges('current').includes(startAge) && labelledAges('second').includes(startAge), tag + ' Startalter auf beiden Linien beschriftet (' + startAge + ')');
  const reaches = tone => dotAges(tone).some(age => age === midAge);
  /* Referenzbreiten sind 390–440 px; auf 320 px kann eine Marke aus Platzgründen entfallen. */
  if (w >= 390) ok(labelledAges('current').includes(midAge) && labelledAges('second').includes(midAge), tag + ' gemeinsamer Vergleichszeitpunkt auf beiden Linien beschriftet (' + midAge + ')');
  else out.push('      ' + tag + ' Vergleichszeitpunkt ' + (labelledAges('current').includes(midAge) && labelledAges('second').includes(midAge) ? 'auf beiden Linien' : 'nur auf einer Linie') + ' (' + midAge + ')');
  if (!reaches('current') || !reaches('second')) out.push('      ' + tag + ' Vergleichszeitpunkt nur auf einer Linie (' + midAge + '; die andere Variante ist vorher aufgebraucht)');

  ok(!/Plan endet|Geld reicht nur bis/.test(d.querySelector('.v4-cmp-chart-card')?.textContent ?? ''), tag + ' keine «Plan endet»-Sprache');
  ok(/laufen AHV und PK-Rente weiter/.test(d.querySelector('.v4-cmp-hint')?.textContent ?? ''), tag + ' Hinweis: AHV und PK-Rente laufen weiter');
  /* 6) Umschalter Vermögen ⇄ Einkommen */
  const assetsKey = pills.join(' | ');
  d.querySelector('[data-cmp-view="income"]')?.click();
  await wait(600);
  ok(d.querySelector('.v4-cmp-chart-card h2')?.textContent.trim() === 'Einkommensentwicklung', tag + ' Umschalter wechselt auf die Einkommensansicht');
  ok(d.querySelector('[data-cmp-view="income"]')?.getAttribute('aria-pressed') === 'true' && d.querySelector('[data-cmp-view="assets"]')?.getAttribute('aria-pressed') === 'false', tag + ' Segmentzustand wechselt mit');
  const incomeKey = pillsOf().join(' | ');
  ok(incomeKey !== assetsKey && pillsOf().length >= 4, tag + ' Einkommensansicht zeigt eigene Werte (' + pillsOf().join(' / ') + ')');
  d.querySelector('[data-cmp-view="assets"]')?.click();
  await wait(550);
  const snapshot = () => ({
    current: cardsOf()[0]?.textContent.replace(/\s+/g, ' ').trim() ?? '',
    second: cardsOf()[1]?.textContent.replace(/\s+/g, ' ').trim() ?? '',
    summary: d.querySelector('.v4-cmp-summary')?.textContent.replace(/\s+/g, ' ').trim() ?? '',
    rows: [...d.querySelectorAll('.v4-cmp-row')].map(row => [...row.querySelectorAll('.v4-cmp-val')].map(node => node.textContent.trim()).join(' / ')).join(' || '),
    pills: pillsOf().join(' | ')
  });
  /* 7) Vergleichswechsel aktualisiert alles und lässt den aktuellen Plan unberührt */
  const beforeSwitch = snapshot();
  const other = d.querySelector('[data-cmp-share]');
  /* Eine andere als die bereits gewählte Variante – die Auswahl kann aus einer früheren
     Prüfung gemerkt sein (Nutzereinstellung «retirement-v4-compare»). */
  const selectedShare = Number(other?.value);
  const targetShare = options.find(option => option !== selectedShare) ?? options[options.length - 1];
  other.value = String(targetShare);
  other.dispatchEvent(new win.Event('change', {bubbles:true}));
  await wait(700);
  const afterSwitch = snapshot();
  ok(afterSwitch.current === beforeSwitch.current, tag + ' aktueller Plan bleibt links unverändert');
  ok(afterSwitch.second !== beforeSwitch.second && afterSwitch.pills !== beforeSwitch.pills && afterSwitch.rows !== beforeSwitch.rows, tag + ' Wechsel aktualisiert Karte, Grafik und Detailwerte');
  const summaryText = () => d.querySelector('.v4-cmp-summary')?.textContent.replace(/\s+/g, ' ').trim() ?? '';
  ok(/^Mehr Kapital hält in dieser Planung länger Vermögen verfügbar\./.test(summaryText()) && /Mehr Rente gibt dir dafür lebenslang ein höheres Einkommen\.$/.test(summaryText()), tag + ' Fazit aus den Varianten abgeleitet («' + summaryText() + '»)');
  ok(!/besser|empfohlen|optimal|solltest/i.test(summaryText()), tag + ' Fazit ohne Wertung oder Empfehlung');
  ok(!d.querySelector('[data-adopt-variant]') && !/Übernehmen/.test(d.querySelector('.v4-cmp')?.textContent ?? ''), tag + ' kein «Übernehmen» im Vergleich');
  ok(store()?.state?.details?.pension?.pkShare === shareBefore && store()?.state?.riskProfile === strategyBefore, tag + ' Plan und Anlagestrategie bleiben unverändert (' + store()?.state?.details?.pension?.pkShare + ' % / ' + store()?.state?.riskProfile + ')');
  /* Eine Definition, eine Zahl: «Vermögen reicht bis» in Statusbox, Karte und Grafik. */
  const reachText = cardsOf()[0]?.querySelectorAll('.v4-cmp-values dd')[2]?.textContent.trim() ?? '';
  const reachValue = reachText.replace(/^Alter /, '');
  if (statusReach) ok(reachValue === statusReach || reachValue === statusReach + '+', tag + ' Vergleich zeigt dieselbe Reichweite wie die Statusbox (' + reachText + ' / Statusbox ' + statusReach + ')');
  if (/^\d+$/.test(reachValue)) ok(pills.some(text => text === '0 mit ' + reachValue), tag + ' Grafik markiert denselben Aufbrauch wie die Karte («0 mit ' + reachValue + '» in ' + pills.join(' | ') + ')');
  else ok(!pills.some(text => /^0 mit/.test(text)), tag + ' kein Aufbrauchlabel, wenn das Vermögen bis zum Horizont reicht (' + reachText + ')');
  /* 7b) Die gewählte Vergleichsvariante und die Ansicht sind Nutzereinstellungen und überleben
     ein echtes Neuladen der Seite – unabhängig vom gespeicherten Plan. */
  const switchedShare = Number(options[options.length - 1]);
  const prefs = (() => { try { return JSON.parse(win.localStorage.getItem('retirement-v4-compare') ?? '{}'); } catch (error) { return {}; } })();
  ok(Number(prefs.share) === switchedShare && prefs.view === 'assets', tag + ' gewählte Variante und Ansicht werden gemerkt (' + JSON.stringify(prefs) + ')');
  const freshFrame = async () => {
    const next = await frame(w, 844), nd = next.contentDocument;
    if (!nd.querySelector('[data-cmp-share]')) { nd.querySelector('[data-v4-next="compare"]')?.click(); await wait(700); }
    return [next, nd];
  };
  const [f2, d2] = await freshFrame();
  ok(Number(d2.querySelector('[data-cmp-share]')?.value) === switchedShare, tag + ' nach dem Neuladen ist dieselbe Variante gewählt (' + (d2.querySelector('[data-cmp-share]')?.value ?? '–') + ' % statt ' + switchedShare + ' %)');
  ok(d2.querySelector('[data-cmp-view="assets"]')?.getAttribute('aria-pressed') === 'true', tag + ' Ansicht Vermögen bleibt nach dem Neuladen gewählt');
  d2.querySelector('[data-cmp-view="income"]')?.click();
  await wait(500);
  const [f3, d3] = await freshFrame();
  ok(d3.querySelector('[data-cmp-view="income"]')?.getAttribute('aria-pressed') === 'true' && d3.querySelector('.v4-cmp-chart-card h2')?.textContent.trim() === 'Einkommensentwicklung', tag + ' Ansicht Einkommen bleibt nach dem Neuladen gewählt');
  /* Ansicht wieder auf Vermögen stellen: die gemerkte Ansicht gilt für die folgenden Breiten. */
  d3.querySelector('[data-cmp-view="assets"]')?.click();
  await wait(400);
  f2.remove(); f3.remove();

  /* 8) Detailvergleich: sieben Zeilen, Steuerwerte, Farbspalten, ⓘ – alles eingeklappt */
  const folds = [...d.querySelectorAll('.v4-cmp-fold, .v4-cmp-basis')];
  const ctaRow = d.querySelector('.v4-cmp-cta-row');
  ok(folds.length === 2 && folds.every(node => !node.open) && !!ctaRow, tag + ' zwei zugeklappte Informationszeilen und eine Beratungs-Card (' + folds.length + ' / ' + (ctaRow ? 'CTA' : 'kein CTA') + ')');
  ok(folds.every(node => !!node.querySelector('summary .v4-cmp-fold-head, summary .v4-cmp-basis-head')), tag + ' jeder Abschnitt mit Kopfzeile und Zusammenfassung');
  ok(!d.querySelector('.v4-cmp-row')?.checkVisibility(), tag + ' zugeklappt keine Detailzeilen sichtbar');
  folds.forEach(node => node.querySelector('summary')?.click());
  await wait(400);
  ok(folds.every(node => node.open) && d.querySelector('.v4-cmp-row')?.checkVisibility() === true, tag + ' Tap klappt alle drei Abschnitte auf');
  const rows = [...d.querySelectorAll('.v4-cmp-row')];
  const labels = rows.map(row => row.querySelector('.v4-cmp-row-label')?.textContent.replace(/\s+/g, ' ').trim() ?? '');
  ok(rows.length === 7, tag + ' sieben Vergleichszeilen (' + rows.length + ')');
  ok(labels.some(label => /^Kapitalsteuer/.test(label)) && labels.some(label => /^Verfügbares Startkapital/.test(label)) && labels.some(label => /^PK-Rente netto/.test(label)) && labels.some(label => /^Laufende Einkommensteuer/.test(label)) && labels.some(label => /^Danach Einkommen/.test(label)), tag + ' Zeilen des Detailvergleichs (' + labels.join(' | ') + ')');
  const valueColors = rows.map(row => { const spans = [...row.querySelectorAll('.v4-cmp-val')]; return win.getComputedStyle(spans[0]).color + '|' + win.getComputedStyle(spans[1]).color; });
  ok(valueColors.every(pair => pair === green + '|' + blue), tag + ' Wertspalten grün/blau wie Karten und Grafik (' + valueColors[0] + ')');
  ok(rows.every(row => [...row.querySelectorAll('.v4-cmp-val')].every(span => /^(CHF [\d'’]+|Alter \d+\+?|–)$/.test(span.textContent.trim()))), tag + ' Schweizer Format in allen Wertspalten');
  const afterInfo = rows[6]?.querySelector('.v3-modal-icon');
  afterInfo?.click();
  await wait(300);
  ok(/nachdem dein frei verfügbares Vermögen aufgebraucht ist/.test(d.getElementById('v4ModalBody')?.textContent ?? ''), tag + ' ⓘ erklärt «Danach Einkommen»');
  d.querySelector('[data-modal-close]')?.click();
  await wait(250);
  /* 9) Strategiecard mit CTA in den bestehenden Beratungsflow */
  const advice = d.querySelector('.v4-cmp-cta-row');
  ok(/Und deine Anlagestrategie\?/.test(advice?.textContent ?? '') && /Passt deine Strategie zu Rente, Bedarf und Anlagehorizont\?/.test(advice?.textContent ?? ''), tag + ' Beratungs-Card nennt Titel und Frage');
  ok(/Individuell besprechen/.test(advice?.textContent ?? '') && !advice?.querySelector('summary'), tag + ' Beratungs-Card ist ein CTA (kein Accordion) mit «Individuell besprechen →»');
  const ctaStyle = advice ? win.getComputedStyle(advice) : null;
  ok(ctaStyle?.borderTopColor === green && /^rgb\(237, 242, 237\)$/.test(ctaStyle?.backgroundColor ?? ''), tag + ' Beratungs-Card mit grünem Rahmen und Mint-Fläche (' + ctaStyle?.backgroundColor + ' / ' + ctaStyle?.borderTopColor + ')');
  d.querySelector('[data-v4-action="advisor"]')?.click();
  await wait(400);
  ok(d.getElementById('v4ModalTitle')?.textContent.trim() === 'Angaben für die Beratung', tag + ' CTA öffnet den bestehenden Beratungsflow (' + (d.getElementById('v4ModalTitle')?.textContent ?? '') + ')');
  d.querySelector('[data-modal-close]')?.click();
  await wait(250);
  /* 10) Berechnungsbasis */
  const basis = d.querySelector('.v4-cmp-basis');
  const basisLine = basis?.querySelector('.v4-cmp-basis-line')?.textContent ?? '';
  ok(/^[A-Z]{2} · [\d,]+ % · (Vorsichtig|Ausgewogen|Chancenorientiert) · bis \d+$/.test(basisLine), tag + ' Berechnungsbasis geschlossen kompakt («' + basisLine + '»)');
  ok(basis?.querySelector('summary')?.getBoundingClientRect().height <= 44, tag + ' Berechnungsbasis bleibt zweizeilig (' + Math.round(basis?.querySelector('summary')?.getBoundingClientRect().height ?? 0) + ' px)');
  ok(!!basis?.querySelector('.v4-cmp-basis-head svg') && !/⚙/.test(basis?.textContent ?? ''), tag + ' Berechnungsbasis mit Tabler-Icon statt Emoji');
  if (!basis?.open) basis?.querySelector('summary')?.click();
  await wait(300);
  ok(basis?.open === true && basis.querySelectorAll('.v3-info-list > div').length >= 8, tag + ' Berechnungsbasis aufklappbar (' + (basis?.querySelectorAll('.v3-info-list > div').length ?? 0) + ' Zeilen)');
  const basisText = d.querySelector('.v4-cmp-basis-body')?.textContent ?? '';
  ok(/Wohnkanton/.test(basisText) && /Umwandlungssatz/.test(basisText) && /Anlagestrategie/.test(basisText) && /Inflation/.test(basisText) && /Planungshorizont/.test(basisText), tag + ' aufgeklappt alle Annahmen mit Bezeichnungen');
  ok(d.documentElement.scrollWidth <= d.documentElement.clientWidth, tag + ' kein horizontaler Überlauf (' + d.documentElement.scrollWidth + ' ≤ ' + d.documentElement.clientWidth + ')');
  /* 11) Zweiter Einstieg und Ein-Varianten-Fall */
  win.V4.renderVariants();
  await wait(450);
  ok(!!d.querySelector('.v4-cmp-entry[data-v4-next="compare"]'), tag + ' zweiter Einstieg auf «Meine Varianten»');
  win.__v4SuspendSave = true; win.localStorage.removeItem('retirement-v3-plan'); win.V4.renderStart();
  await wait(450);
  ok(!d.querySelector('[data-v4-next="compare"]'), tag + ' ohne Plan kein Vergleichseinstieg');
  win.__v4SuspendSave = false;
  /* Gemerkte Vergleichseinstellungen entfernen, damit die nächste Breite im Ausgangszustand startet. */
  try { win.localStorage.removeItem('retirement-v4-compare'); } catch (error) { /* Speicher nicht verfügbar */ }
  f.remove();
}

/* ---------- Eingabeverhalten der Betragsfelder ----------
   Tippen, Einfügen, Löschen und Cursorposition in den Editoren: schweizerische Gruppierung,
   Dezimalkomma, keine Buchstaben, stabiler Cursor – und der Wert kommt so im Plan an. */
async function amountInputChecks(w) {
  const f = await frame(w, 844), d = f.contentDocument, win = f.contentWindow, tag = w + 'px Betragsfeld';
  win.DevFixture.write(win.DevFixture.scenarios['knapp']()); win.V4.load();
  await wait(500);
  await openEditor(d, 'ahv');
  const input = d.getElementById('ahv');
  ok(!!input && input.hasAttribute('data-amount'), tag + ' AHV-Feld gefunden (' + (input?.value ?? 'fehlt') + ')');
  if (!input) { f.remove(); return; }
  const digits = () => input.value.replace(/\D/g, '');
  const type = async char => {
    const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? start;
    input.value = input.value.slice(0, start) + char + input.value.slice(end);
    input.setSelectionRange(start + 1, start + 1);
    input.dispatchEvent(new win.Event('input', {bubbles:true}));
    await wait(20);
  };
  const pressBackspace = async () => {
    const start = input.selectionStart ?? input.value.length, end = input.selectionEnd ?? start;
    const event = new win.KeyboardEvent('keydown', {key:'Backspace', bubbles:true, cancelable:true});
    const notPrevented = input.dispatchEvent(event);
    if (notPrevented) {
      if (start === end && start > 0) { input.value = input.value.slice(0, start - 1) + input.value.slice(start); input.setSelectionRange(start - 1, start - 1); }
      else { input.value = input.value.slice(0, start) + input.value.slice(end); input.setSelectionRange(start, start); }
      input.dispatchEvent(new win.Event('input', {bubbles:true}));
    }
    await wait(20);
  };
  const reset = async value => { input.value = value; input.dispatchEvent(new win.Event('input', {bubbles:true})); await wait(20); input.focus(); input.setSelectionRange(input.value.length, input.value.length); };
  await reset('');
  for (const char of '3000') await type(char);
  ok(input.value === "3'000" && input.selectionStart === 5, tag + ' «3000» wird zu «3\'000» mit Cursor am Ende (' + input.value + ' / ' + input.selectionStart + ')');
  await reset('3000');
  input.setSelectionRange(1, 1);
  await type('5');
  ok(input.value === "35'000" && input.selectionStart === 2, tag + ' Tippen in der Mitte hält den Cursor hinter der Ziffer (' + input.value + ' / ' + input.selectionStart + ')');
  await reset("3'000");
  input.setSelectionRange(2, 2);
  await pressBackspace();
  ok(input.value === '0' && digits() === '0', tag + ' Backspace hinter dem Trennzeichen löscht die Ziffer davor (' + input.value + ')');
  await reset('');
  for (const char of '4,5') await type(char);
  ok(input.value === '4,5', tag + ' Dezimalkomma bleibt erhalten («' + input.value + '»)');
  await reset('');
  for (const char of '1a2b') await type(char);
  ok(input.value === '12', tag + ' Buchstaben werden beim Tippen verworfen («' + input.value + '»)');
  await reset('');
  input.value = "1'234.50 CHF";
  input.dispatchEvent(new win.Event('input', {bubbles:true}));
  await wait(30);
  ok(input.value === "1'234,50", tag + ' eingefügter Text wird bereinigt und komma-formatiert («' + input.value + '»)');
  await reset('1234567');
  const fits = input.scrollWidth <= input.clientWidth + 1;
  ok(fits, tag + ' siebenstelliger Betrag passt ins Feld (' + input.value + ' · ' + input.scrollWidth + ' ≤ ' + input.clientWidth + ')');
  await reset('3000');
  d.getElementById('v4DetailForm')?.dispatchEvent(new win.Event('submit', {bubbles:true, cancelable:true}));
  await wait(600);
  const stored = JSON.parse(win.localStorage.getItem('retirement-v3-plan') ?? '{}')?.state?.details?.income?.ahv;
  const afterTitle = d.querySelector('.v4-page-title')?.textContent.trim() ?? '';
  ok(afterTitle === 'Mein Plan.' && Number(stored) === 3000, tag + ' «Übernehmen» speichert den Betrag numerisch (Titel «' + afterTitle + '», AHV ' + stored + ' als ' + typeof stored + ', Fehler «' + (d.getElementById('v4Error')?.textContent ?? '') + '»)');
  f.remove();
}

  }
  flush();
  for (const [w, h] of [[390,844],[320,760],[1000,900]]) {
    try { await comparisonChecks(w, h); } catch (e) { ok(false, w + ' Vergleich: ' + e.message); }
  }
  flush();
  for (const w of [390, 1000]) {
    try { await amountInputChecks(w); } catch (e) { ok(false, w + ' Betragsfeld: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await separatorChecks(w, h); } catch (e) { ok(false, w + ' Separator: ' + e.message); }
  }
  flush();

    try { await assumptionsChecks(w, h); } catch (e) { ok(false, w + ' Annahmen: ' + e.message); }
  }
  flush();
  for (const [w, h] of [[390,844],[1000,900]]) {
    try { await horizonChecks(w, h); } catch (e) { ok(false, w + ' Horizontwert: ' + e.message); }
  }

  }
  try { await modalCloseStyleChecks(); } catch (e) { ok(false, 'Modal-Schliessen (CSS): ' + e.message); }
  const fails = out.filter(l => l.startsWith('FAIL')).length;
  document.getElementById('report').textContent = out.join('\n') + '\n---\n' + (fails ? fails + ' FAIL' : 'ALLE CHECKS PASS');
